<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Wendy's Star Library, a pastel scrapbook of little discoveries">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8ed"/><stop offset=".55" stop-color="#fffaf4"/><stop offset="1" stop-color="#eff5ed"/>
    </linearGradient>
    <linearGradient id="notebook" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8e1d1"/><stop offset="1" stop-color="#edcabd"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6d5b4e" flood-opacity=".12"/>
    </filter>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.05" fill="#c7d7c7" opacity=".32"/>
    </pattern>
  </defs>

  <!-- A warm postcard, with a stitched margin and hand-cut decorative notes. -->
  <rect x="6" y="6" width="1188" height="408" rx="37" fill="url(#paper)" stroke="#e6d8c5" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="380" rx="28" fill="url(#dots)"/>
  <path d="M48 43H1150 M48 377H1150" stroke="#e5d6c5" stroke-width="1.4" stroke-dasharray="3 10" stroke-linecap="round"/>
  <path d="M69 82H87 M79 72V92" stroke="#b2d4bf" stroke-width="3" stroke-linecap="round"/>
  <path d="M506 74l6 12 13 2-10 9 3 14-12-7-12 7 3-14-10-9 13-2z" fill="#f6d681" opacity=".77"/>
  <path d="M95 310l5 10 11 2-9 8 2 11-9-6-10 6 3-11-8-8 11-2z" fill="#f2beae" opacity=".85"/>
  <path d="M1078 325l4 9 9 2-7 6 2 10-8-5-9 5 2-10-7-6 10-2z" fill="#f4cf72"/>
  <circle cx="532" cy="312" r="4" fill="#edbaa8" opacity=".8"/>
  <circle cx="73" cy="245" r="3" fill="#aac8b8"/>
  <circle cx="560" cy="106" r="2.8" fill="#c9bfdd"/>
  <path d="M479 279q29 24 53 0q21-17 36-3" fill="none" stroke="#e6b0a5" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>

  <!-- Editorial typography: large enough to survive GitHub mobile rendering. -->
  <text x="79" y="115" font-size="17" font-weight="700" letter-spacing="3.2" fill="#9c7c70" font-family="Trebuchet MS,Arial,sans-serif">✦  A LITTLE BOOK OF BRIGHT IDEAS  /  VOL. 01</text>
  <text x="77" y="188" font-size="51" font-weight="500" fill="#435d4f" font-family="Georgia,Palatino Linotype,serif">wendy's</text>
  <text x="72" y="259" font-size="76" font-weight="700" fill="#365748" letter-spacing="-3" font-family="Georgia,Palatino Linotype,serif">star library</text>
  <path d="M79 273q156 10 362 0" fill="none" stroke="#f0ca74" stroke-width="10" opacity=".75" stroke-linecap="round"/>
  <text x="79" y="324" font-size="23" font-weight="500" fill="#728579" font-family="PingFang SC,Microsoft YaHei,sans-serif">把喜欢的开源灵感，收进星星手账。</text>
  <rect x="79" y="347" width="254" height="29" rx="14.5" fill="#e4efe4" stroke="#c2d7c5"/>
  <text x="206" y="367" font-size="13" font-weight="700" text-anchor="middle" fill="#577563" letter-spacing="1" font-family="Trebuchet MS,Arial,sans-serif">MADE OF LITTLE DISCOVERIES  ♡</text>

  <!-- Cream journal page behind the pink notebook. -->
  <g filter="url(#soft)">
    <g transform="translate(751 75) rotate(8 161 143)">
      <rect x="0" y="0" width="324" height="282" rx="19" fill="#fcfaf3" stroke="#d7cfbe" stroke-width="3"/>
      <path d="M27 48H296 M27 81H296 M27 114H296 M27 147H296 M27 180H296 M27 213H296" stroke="#e4e6da" stroke-width="1.3"/>
      <path d="M41 17V263" stroke="#eabfb4" stroke-width="1.5"/>
    </g>
    <g transform="translate(672 56) rotate(-7 161 145)">
      <rect x="0" y="0" width="323" height="294" rx="23" fill="url(#notebook)" stroke="#b38c80" stroke-width="3"/>
      <rect x="14" y="15" width="292" height="263" rx="17" fill="none" stroke="#fff6ed" stroke-width="1.8" stroke-dasharray="3 7"/>
      <path d="M20 35v218" stroke="#bf8f86" stroke-width="5" stroke-linecap="round"/>
      <circle cx="22" cy="67" r="7.5" fill="#fffaf1" stroke="#ac8c81" stroke-width="1.5"/>
      <circle cx="22" cy="122" r="7.5" fill="#fffaf1" stroke="#ac8c81" stroke-width="1.5"/>
      <circle cx="22" cy="177" r="7.5" fill="#fffaf1" stroke="#ac8c81" stroke-width="1.5"/>
      <circle cx="22" cy="232" r="7.5" fill="#fffaf1" stroke="#ac8c81" stroke-width="1.5"/>
      <rect x="58" y="35" width="215" height="34" rx="17" fill="#fffaf1" opacity=".86"/>
      <text x="165" y="57" font-size="13" text-anchor="middle" font-weight="800" fill="#836f66" letter-spacing="2" font-family="Trebuchet MS,Arial,sans-serif">THE LITTLE COLLECTION</text>
      <g transform="translate(148 144)">
        <path d="M0-63 L19-23 64-18 31 12 39 56 0 35 -39 56 -31 12 -64-18 -19-23Z" fill="#f8d475" stroke="#746254" stroke-width="4" stroke-linejoin="round"/>
        <ellipse cx="-14" cy="2" rx="3.1" ry="4.1" fill="#746254"/>
        <ellipse cx="14" cy="2" rx="3.1" ry="4.1" fill="#746254"/>
        <path d="M-5 10Q0 16 5 10" stroke="#746254" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <ellipse cx="-26" cy="10" rx="10" ry="5.5" fill="#f3aba7" opacity=".78"/>
        <ellipse cx="26" cy="10" rx="10" ry="5.5" fill="#f3aba7" opacity=".78"/>
      </g>
      <path d="M93 209Q164 231 234 209" fill="none" stroke="#c99b90" stroke-width="2.2" stroke-dasharray="2 9" stroke-linecap="round"/>
      <text x="166" y="257" font-size="13" text-anchor="middle" fill="#765f59" font-family="Georgia,serif" font-style="italic">keep exploring, little star!</text>
    </g>
  </g>

  <!-- Pastel sticker accents and a little washi tape. -->
  <g transform="translate(985 41) rotate(17)">
    <rect x="0" y="0" width="102" height="31" rx="5" fill="#c5e0cb" opacity=".85"/>
    <path d="M17 4V27 M35 4V27 M53 4V27 M71 4V27 M89 4V27" stroke="#f7fbef" stroke-width="2" opacity=".36"/>
  </g>
  <g transform="translate(991 261) rotate(13)">
    <circle cx="48" cy="48" r="45" fill="#e7f0de" stroke="#b4d2ba" stroke-width="2.5" stroke-dasharray="4 7"/>
    <path d="M48 22l6 18 19 1-15 12 5 19-15-11-16 11 5-19-15-12 20-1z" fill="#e7b7b0" stroke="#877269" stroke-width="2"/>
    <text x="48" y="88" text-anchor="middle" font-size="10" fill="#738270" font-family="Georgia,serif">a tiny wish</text>
  </g>
  <path d="M1095 92q12-9 23-1q8-10 21-3q9 6 6 18q18 16-1 25q-9 4-19-3q-16 11-26-4q-17-3-8-19z" fill="#fff8eb" stroke="#e7d0b9" stroke-width="2"/>
  <path d="M1120 99l3 7 8 1-6 5 1 8-6-4-7 4 2-8-6-5 8-1z" fill="#f2cd75"/>
</svg>